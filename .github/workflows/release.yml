name: Release

# يعمل عند دفع وسم يبدأ بـ v (مثل v0.2.0): يبني APK موقّعًا وينشر GitHub Release ثم يُخطر التطبيقات عبر Firestore وFCM.
# الأسرار المطلوبة (Settings > Secrets and variables > Actions): انظر .github/README.md
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (إلزامية)
#   GOOGLE_SERVICES_JSON            (لتفعيل تسجيل الدخول والمزامنة في النسخة المنشورة)
#   FIREBASE_SERVICE_ACCOUNT_JSON   (لكتابة app_versions وإرسال FCM؛ بدونه تُتخطى هذه الخطوة)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize gradle.properties (no BOM)
        run: sed -i '1s/^\xEF\xBB\xBF//' gradle.properties

      - name: Read and validate version
        id: ver
        run: |
          NAME=$(grep -E '^yaqeen\.versionName=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r ')
          CODE=$(grep -E '^yaqeen\.versionCode=' gradle.properties | head -1 | cut -d= -f2 | tr -d '\r ')
          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::الوسم $TAG لا يطابق yaqeen.versionName=$NAME في gradle.properties. حدّث الإصدار (tools/release.ps1) قبل الوسم."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key (outside the repo)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::أسرار التوقيع ناقصة (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          KS="$RUNNER_TEMP/yaqeen-release.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS"
          PROPS="$RUNNER_TEMP/keystore.properties"
          {
            echo "storeFile=$KS"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > "$PROPS"
          chmod 600 "$KS" "$PROPS"
          echo "YAQEEN_KEYSTORE_PROPS=$PROPS" >> "$GITHUB_ENV"

      - name: Add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON غير مضبوط: ستُبنى النسخة بلا تسجيل دخول ومزامنة (وضع محلي فقط)."
          fi

      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew --console=plain :app:assembleRelease -Pyaqeen.githubRepo=${{ github.repository }}

      - name: Collect and verify artifacts
        id: art
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "::error::الـAPK غير موقّع (تحقق من أسرار التوقيع)."; exit 1;; esac
          cp "$APK" dist/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/app-release.apk
          (cd dist && sha256sum app-release.apk > app-release.apk.sha256)
          cat dist/app-release.apk.sha256
          echo "sha=$(cut -d' ' -f1 dist/app-release.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          node tools/notify-release.mjs --print-changelog "${{ steps.ver.outputs.name }}" --changelog-source CHANGELOG.md > release-notes.md
          {
            echo
            echo
            echo "SHA-256: ${{ steps.art.outputs.sha }}"
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/app-release.apk dist/app-release.apk.sha256 \
            --title "يقين $TAG" --notes-file release-notes.md --verify-tag

      - name: Install tool dependencies
        if: env.FIREBASE_SA != ''
        working-directory: tools
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Notify apps (Firestore app_versions + FCM topic app_updates)
        if: env.FIREBASE_SA != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node tools/notify-release.mjs \
            --version "${{ steps.ver.outputs.name }}" \
            --version-code "${{ steps.ver.outputs.code }}" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --sha256 "${{ steps.art.outputs.sha }}" \
            --changelog-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/yaqeen-release.jks" "$RUNNER_TEMP/keystore.properties" app/google-services.json
